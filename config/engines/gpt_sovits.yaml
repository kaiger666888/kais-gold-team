# GPT-SoVITS Engine — Track 1: 中文轨 (voice_clone / IP克隆兜底)
engine:
  name: GPT-SoVITS
  track: zh
  role: voice_clone
  description: "角色/IP音色克隆，中文兜底引擎"

server:
  wrapper_port: 9880
  native_port: 9980
  host: 0.0.0.0

model:
  path: ~/GPT-SoVITS
  venv: ~/GPT-SoVITS/.venv
  config: GPT_SoVITS/configs/tts_infer.yaml

gpu:
  cuda_device: 0  # 3090
  vram_gb: 4.0
  gpu_name: RTX 3090

env:
  CUDA_VISIBLE_DEVICES: "0"
  NLTK_DATA: /home/kai/nltk_data
  HF_HUB_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"

endpoints:
  health: /health
  tts: /tts
  tts_raw: /tts/raw

default_params:
  text_lang: zh
  speed_factor: 1.0
  temperature: 1.0
  top_k: 15
  top_p: 1.0
  text_split_method: cut5
  batch_size: 1
