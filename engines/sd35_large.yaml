# SD3.5 Large Text-to-Image (Node 2)
# Local image: kais-sdxl:latest (SDXL serves both sdxl and sd35)
# GPU: RTX 3090, ~8GB VRAM

name: sd35_large
engine: sd35_large
docker_image: kais-sdxl:latest
api_port: 8087
requires_gpu: true
mode: api

task_types:
  sd35_draw:
    submit_endpoint: /generate
    health_endpoint: /health
    poll_timeout: 120
    poll_interval: 2.0
    params:
      prompt:
        type: string
        default: ""
      negative_prompt:
        type: string
        default: ""
      width:
        type: int
        default: 1024
      height:
        type: int
        default: 1024
      guidance_scale:
        type: float
        default: 4.5
      num_inference_steps:
        type: int
        default: 28
    assets:
      required: []
      accept: []
