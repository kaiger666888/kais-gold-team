# Yue-7B Music Generation Engine (Node 23)
# Local image: kais-yue:latest
# GPU: RTX 3090, ~8GB VRAM

name: yue
engine: yue
docker_image: kais-yue:latest
api_port: 8092
requires_gpu: true
mode: api

task_types:
  music_generate:
    submit_endpoint: /generate
    health_endpoint: /health
    poll_timeout: 300
    poll_interval: 3.0
    params:
      prompt:
        type: string
        default: ""
      duration:
        type: int
        default: 30
      genre:
        type: string
        default: "cinematic"
    assets:
      required: []
      accept: []
