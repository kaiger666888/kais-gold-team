# LivePortrait Virtual Human Engine (Node 12/13)
# Local image: kais-liveportrait:latest
# GPU: RTX 3060Ti, ~6GB VRAM

name: liveportrait
engine: liveportrait
docker_image: kais-liveportrait:latest
api_port: 8085
requires_gpu: true
mode: api

task_types:
  liveportrait_generate:
    submit_endpoint: /generate
    health_endpoint: /health
    poll_timeout: 120
    poll_interval: 2.0
    params:
      driving_method:
        type: string
        default: "expression"
    assets:
      required:
        - role: face_image
          type: image
          description: "Face image for animation"
      accept: [image]
