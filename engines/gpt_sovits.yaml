# GPT-SoVITS 角色/IP 音色克隆引擎 (兜底)
# 3090 按需服务 | ~4GB VRAM | Port 9880
# API: POST /tts  GET /health
# 用途: 角色/IP音色克隆兜底（当 CosyVoice 克隆"音色像但不够像"时启用）
# 定位: 不做主声道，仅在需要精确音色克隆时使用

name: gpt_sovits
engine: gpt_sovits
docker_image: none  # runs as native service
api_port: 9880
api_host: "127.0.0.1"
requires_gpu: true
gpu_id: 0  # RTX 3090 (CUDA_VISIBLE_DEVICES=0)
mode: http
vram_gb: 4.0

task_types:
  tts_zh:
    submit_endpoint: /tts
    health_endpoint: /health
    poll_timeout: 60
    poll_interval: 1.0
    params:
      text:
        type: string
        default: ""
        description: "中文文本"
      reference_audio:
        type: string
        default: ""
        description: "角色参考音频URL或路径"
      reference_text:
        type: string
        default: ""
        description: "参考音频对应的文本"
      language:
        type: string
        default: "zh"
        description: "语言代码 zh/en"
      speed:
        type: float
        default: 1.0
        description: "语速 0.5-2.0"
      emotion:
        type: string
        default: ""
        description: "情感标签 happy/sad/angry"
    assets:
      required:
        - role: reference_audio
          type: audio
          description: "角色声纹参考音频 (10秒)"
      accept: [audio]
